<style include="cr-shared-style settings-shared iron-flex">
  #flyweb-account-section
  {
    padding-inline-end: var(--cr-section-padding);
    padding-inline-start: var(--cr-section-indent-padding);
  }
  #sync-separator
  {
    border-bottom: var(--cr-separator-line);
  }

  #disabled-by-admin-icon
  {
    text-align: center;
    width: 40px;
  }
  #sync-page-loading
  {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
  }
  #sync-section
  {
    display: block;
    padding-block-end: 0;
    padding-block-start: 0;
    padding-inline-end: var(--cr-section-padding);
    padding-inline-start: var(--cr-section-indent-padding);
  }
</style>

<!-- Disabled content -->
<div class="cr-row first" hidden="[[!syncDisabledByAdmin_]]">
  <cr-icon id="disabled-by-admin-icon" icon="cr20:domain"></cr-icon>
  <div class="flex cr-padded-text">
    $i18n{syncDisabledByAdministrator}
  </div>
</div>

<!-- FlyWeb 3.2: the account (FlyWeb/docs/sync-cuenta.md §9). Without an
     account service in this profile it shows nothing and the old setup
     below stays. -->
<div id="flyweb-account-section" hidden="[[syncDisabledByAdmin_]]">
  <settings-flyweb-sync-account id="flywebAccount"
      account-status="{{flywebAccountStatus_}}"
      on-setup-success="onSetupSuccess_">
  </settings-flyweb-sync-account>
</div>

<!-- Sync words decryption error, safe storage locked-->
<div class="cr-row first" hidden="[[!hasLockedSafeStorage_]]">
  <div class="flex cr-padded-text">
    $i18nRaw{braveSyncPassphraseDecryptionErrorMessage}
  </div>
</div>

<!-- Sync words decryption error, safe storage unlocked-->
<!-- FlyWeb 3.2: with the account, «claves ilegibles» and «Volver a unir este
     Mac» are the account's (§9). -->
<div class="cr-row first"
    hidden="[[!showOldRejoin_(hasUnlockedSafeStorageCannotDecryptSeed_, flywebAccountStatus_)]]">
  <div class="flex cr-padded-text">
    <p>$i18nRaw{braveSyncPassphraseDecryptionErrorUnlockedSsMessage}</p>
    <div class="actions">
      <cr-button class="action-button"
        on-click="onRejoin_"
      >
        $i18n{braveSyncLeaveAndRejoinTheChainButton}
      </cr-button>
    </div>
  </div>
</div>

<!-- Page ends here if sync is disabled -->
<div id="sync-separator" hidden="[[!syncSectionDisabled_]]"></div>

<!-- Non-disabled content (setup or configure) -->
<template is="dom-if" if="[[!syncSectionDisabled_]]">
  <div id="sync-section">
    <div id="sync-page-loading"
        hidden$="[[!isStatus_('spinner', pageStatus_)]]">
      $i18n{syncLoading}
    </div>

    <!-- FlyWeb 3.2: the sync types stay as they were, under the account,
         while this Mac syncs a chain. -->
    <template is="dom-if"
        if="[[showConfigure_(pageStatus_, flywebAccountStatus_)]]">
      <settings-brave-sync-configure syncStatus="[[syncStatus]]"
          flyweb-account-available="[[isFlyWebAccountAvailable_(flywebAccountStatus_)]]"
          has-flyweb-account="[[hasFlyWebAccount_(flywebAccountStatus_)]]">
      </settings-brave-sync-configure>
    </template>

    <!-- FlyWeb 3.2: «Empezar una cadena» and «Tengo un código» give way to
         the account (decision 9); they stay for a profile without it. -->
    <template is="dom-if" if="[[showOldSetup_(pageStatus_, flywebAccountStatus_)]]">
      <settings-brave-sync-setup on-setup-success="onSetupSuccess_"
       sync-code-dialog-type="{{syncCodeDialogType}}">
      </settings-brave-sync-setup>
    </template>
  </div>
</template>
