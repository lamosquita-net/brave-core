<style include="settings-shared">
  cr-view-manager [hidden-by-search] {
    display: none;
  }
</style>

<cr-view-manager id="viewManager" class="cr-centered-card-container"
    show-all$="[[shouldShowAll]]">
  <settings-section slot="view" id="parent"
      page-title="$i18n{braveDefaultExtensions}">
    <settings-brave-default-extensions-page prefs="{{prefs}}">
    </settings-brave-default-extensions-page>
  </settings-section>
</cr-view-manager>
