<style include="settings-shared">
  cr-view-manager [hidden-by-search],
  cr-view-manager[show-all] [slot=view][data-parent-view-id] {
    display: none;
  }
</style>

<cr-view-manager id="viewManager" class="cr-centered-card-container"
    show-all$="[[shouldShowAll]]">
  <settings-brave-sync-page slot="view" id="braveSync" label="[[syncLabel_]]">
  </settings-brave-sync-page>

  <settings-subpage slot="view" id="setup" data-parent-view-id="braveSync"
      route-path="/braveSync/setup" page-title="[[syncLabel_]]">
    <settings-brave-sync-subpage sync-status="[[syncStatus_]]">
    </settings-brave-sync-subpage>
  </settings-subpage>
</cr-view-manager>
