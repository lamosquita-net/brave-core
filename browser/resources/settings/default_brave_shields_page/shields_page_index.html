<style include="settings-shared">
  cr-view-manager [hidden-by-search],
  cr-view-manager[show-all] [slot=view][data-parent-view-id] {
    display: none;
  }

  cr-view-manager [slot=view]:not(.closing) {
    position: initial;
  }
</style>

<cr-view-manager id="viewManager" class="cr-centered-card-container"
    show-all$="[[shouldShowAll]]">
  <settings-default-brave-shields-page slot="view" id="parent"
      prefs="{{prefs}}">
  </settings-default-brave-shields-page>

  <settings-section slot="view" id="socialBlocking"
      page-title="$i18n{socialBlocking}">
    <settings-social-blocking-page prefs="{{prefs}}">
    </settings-social-blocking-page>
  </settings-section>

  <settings-subpage slot="view" id="adblock" data-parent-view-id="parent"
      route-path="/shields/filters"
      page-title="$i18n{adblockContentFiltersLabel}">
    <brave-adblock-subpage prefs="{{prefs}}"></brave-adblock-subpage>
  </settings-subpage>
</cr-view-manager>
