<style include="settings-shared">
  :host {
    display: block;
  }

  :host([hidden]) {
    display: none;
  }

  cr-view-manager [hidden-by-search] {
    display: none;
  }

  cr-view-manager [slot=view]:not(.closing) {
    position: initial;
  }
</style>

<cr-view-manager id="viewManager" class="cr-centered-card-container"
    show-all$="[[shouldShowAll]]">
  <settings-section slot="view" id="toolbar"
      page-title="$i18n{appearanceSettingsToolbarSection}">
    <settings-brave-appearance-toolbar prefs="{{prefs}}">
    </settings-brave-appearance-toolbar>
  </settings-section>

  <settings-section slot="view" id="tabs"
      page-title="$i18n{appearanceSettingsTabsSection}">
    <settings-brave-appearance-tabs prefs="{{prefs}}">
    </settings-brave-appearance-tabs>
  </settings-section>
</cr-view-manager>
