<style include="settings-shared">
  :host {
    display: block;
  }

  :host([hidden]) {
    display: none;
  }

  cr-view-manager [hidden-by-search] {
    display: none;
  }
</style>

<cr-view-manager id="viewManager" class="cr-centered-card-container"
    show-all$="[[shouldShowAll]]">
  <settings-section slot="view" id="braveSearch" page-title="">
    <settings-brave-search-page prefs="{{prefs}}">
    </settings-brave-search-page>
  </settings-section>
</cr-view-manager>
