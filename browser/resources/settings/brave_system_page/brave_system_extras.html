<style include="settings-shared">
</style>
<settings-section page-title="">
  <template is="dom-if" if="[[shortcutsSupported_]]">
    <cr-link-row id="shortcutsButton" class="hr"
        label="$i18n{braveShortcutsPage}"
        on-click="onShortcutsClick_"
        role-description="$i18n{subpageArrowRoleDescription}">
    </cr-link-row>
  </template>
  <settings-toggle-button class="cr-row"
      pref="{{prefs.brave.enable_closing_last_tab}}"
      label="$i18n{braveClosingLastTab}">
  </settings-toggle-button>
  <settings-toggle-button class="cr-row hr"
      pref="{{prefs.brave.enable_window_closing_confirm}}"
      label="$i18n{braveWarnBeforeClosingWindow}">
  </settings-toggle-button>
<if expr="is_macosx">
  <settings-toggle-button class="cr-row hr"
      pref="{{prefs.browser.confirm_to_quit}}"
      label="$i18n{warnBeforeQuitting}">
  </settings-toggle-button>
</if>
  <settings-toggle-button class="cr-row hr"
      pref="{{prefs.brave.show_fullscreen_reminder}}"
      label="$i18n{braveShowFullscreenReminder}">
  </settings-toggle-button>
</settings-section>
